<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Petugas - LibraryReg</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg bg-white sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <div class="logo-kotak"><i class="bi bi-book"></i></div>
        <div>
          <div class="nama-app">LibraryReg</div>
          <div class="sub-nama">Perpustakaan Universitas</div>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#tentang">Tentang Perpustakaan</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#layanan">Layanan</a></li>
          <li class="nav-item"><a class="nav-link" href="anggota.html">Daftar Anggota</a></li>
          <li class="nav-item"><a class="nav-link" href="daftar.html">Pendaftaran Anggota</a></li>
          <li class="nav-item"><a class="btn btn-biru px-3 active" href="login.html">Login Petugas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== FORM LOGIN ===== -->
  <section class="halaman d-flex align-items-center">
    <div class="container" style="max-width: 440px;">
      <div class="kotak-form">
        <div class="text-center mb-4">
          <div class="logo-kotak mx-auto mb-3" style="width: 60px; height: 60px; font-size: 30px;"><i class="bi bi-person-lock"></i></div>
          <h1 class="h3 fw-bold">Login Petugas</h1>
          <p class="teks-abu mb-0">Masuk untuk mengelola data anggota</p>
        </div>

        <!-- pesan error kalau login salah -->
        <div id="pesanLogin"></div>

        <form id="formLogin">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password">
          </div>
          <button type="submit" class="btn btn-biru w-100 py-2">Masuk</button>
        </form>

        <p class="text-center teks-abu small mt-3 mb-0">Demo: username <b>admin</b>, password <b>admin123</b></p>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <div class="garis-footer text-center mt-0 border-0 pt-0">© 2026 LibraryReg – Perpustakaan Universitas</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
